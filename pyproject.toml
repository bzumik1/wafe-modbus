[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wafe-modbus"
version = "0.0.0"
description = "Read and control WAFE heat recovery units (ACE2 controller) over Modbus as typed Python objects."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Znamenáček" }]
keywords = ["modbus", "wafe", "heat-recovery", "ventilation", "hrv", "erv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["modbus-connection[tmodbus]>=4.12.1"]

[project.urls]
Homepage = "https://github.com/bzumik1/wafe-modbus"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "syrupy>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wafe_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
